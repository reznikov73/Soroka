<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сорока</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <aside id="folder-tree" class="pane">
        <h2>Папки</h2>
        <p class="placeholder">Дерево папок появится позже</p>
      </aside>
      <section id="message-list" class="pane">
        <h2>Письма</h2>
        <p class="placeholder">Сорока ещё в полёте — писем нет</p>
      </section>
      <section id="message-view" class="pane">
        <h2>Письмо</h2>
        <p class="placeholder">Выберите письмо из списка</p>
      </section>
    </div>

    <footer id="status-bar">
      <span id="status-version">Soroka</span>
      <span class="sep">·</span>
      <span id="status-ping">…</span>
      <span class="spacer"></span>
      <button id="ping-btn" type="button">Проверить бэкенд</button>
    </footer>
  </body>
</html>
