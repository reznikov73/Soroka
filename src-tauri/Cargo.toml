[package]
name = "soroka"
version = "0.25.0"
description = "Почтовый клиент «Сорока»"
authors = ["reznikov73"]
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soroka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "=3.0.0-alpha.15"
imap-proto = "0.16"  # флаги папок (\Drafts) и APPENDUID (TASK-022)  # v3-alpha, точный пин; TLS: native-tls (по умолчанию)
base64 = "0.23"
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
lettre = "0.11"  # SMTP-отправка (TASK-004); TLS: native-tls (по умолчанию)
mail-parser = "0.11"  # разбор MIME-тел писем (TASK-005)
ammonia = "4"  # санитизация HTML писем (TASK-005)
window-vibrancy = "0.8"  # акрил/Mica окна (TASK-007)
reqwest = { version = "0.12", features = ["blocking", "json"] }  # GigaChat (TASK-009)
uuid = { version = "1", features = ["v4"] }  # RqUID для OAuth GigaChat (TASK-009)
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"  # файловые логи в %APPDATA%\Soroka\logs (TASK-025)

# Почтовые крейты добавлять ПО ОДНОЙ на задачу (TASK-002+):
# imap / native-tls / lettre / mail-parser / rusqlite(bundled) / reqwest

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
